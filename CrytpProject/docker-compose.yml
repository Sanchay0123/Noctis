
services:
  node-alice:
    build: .
    environment:
      LOG_LEVEL: debug
      MESH_ROLE: alice
    volumes:
      - shared_data:/shared
    networks:
      - meshnet

  node-bob:
    build: .
    environment:
      LOG_LEVEL: debug
      MESH_ROLE: bob
    volumes:
      - shared_data:/shared
    networks:
      - meshnet

  node-carol:
    build: .
    environment:
      LOG_LEVEL: debug
      MESH_ROLE: carol
    volumes:
      - shared_data:/shared
    networks:
      - meshnet
      
  node-dave:
    build: .
    environment:
      LOG_LEVEL: debug
      MESH_ROLE: dave
    volumes:
      - shared_data:/shared
    networks:
      - meshnet

volumes:
  shared_data:

networks:
  meshnet:
    driver: bridge
